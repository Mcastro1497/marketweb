# Pipeline diario de valuación.
#
# Corre run.py: sincroniza series y REM, proyecta CER, y valúa soberanos, ONs,
# dólar linked, TAMAR y duales. Tarda ~85 segundos.
#
# Va DESPUÉS del cierre para que valúe contra los precios del día, que los deja
# el workflow de precios.
name: Pipeline diario

on:
  schedule:
    # Los cron de GitHub son en UTC y no ajustan por horario de verano.
    # 20:30 UTC = 17:30 en Argentina (UTC-3, sin DST).
    - cron: "30 20 * * 1-5"
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: pipeline
  cancel-in-progress: false   # nunca cortar una corrida a mitad de camino

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr el pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:  ${{ secrets.SERVICE_KEY }}
          LOCAL_TZ:     ${{ secrets.LOCAL_TZ }}
        run: |
          # En Actions no hay .venv: se usa el python del runner.
          python run.py --verbose
