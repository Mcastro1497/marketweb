# Valuar loop durante toda la rueda, en un solo job.
#
# Revalúa TODO el universo cada pocos segundos: patas y duales por fórmula
# cerrada, y ONs, hard dollar, dólar linked y soberanos ARS por XIRR sobre flujos.
# Un ciclo completo son ~0,8 segundos sobre 273 bonos.
#
# Carga instrumentos, series y REM UNA VEZ y después sólo relee precios. El 94%
# del tiempo de una corrida suelta se iba releyendo datos que no cambian dentro
# del día; por eso esto puede correr cada 5 segundos y run.py no.
#
# Va partido en dos jobs por el tope de 6 horas de GitHub, igual que precios.
# Arranca 13:00 y el de la mañana corta 13:30: media hora de solape para
# absorber la demora del cron. Los dos escriben el mismo valor calculado
# sobre el mismo precio, así que solaparse es inocuo.
name: Valuar loop

on:
  schedule:
    # GitHub larga los cron programados de este repo entre 2 y 5 horas tarde, de
    # forma consistente y variable (medido sobre precios, valuar_loop y pipeline).
    # No es la expresión: le pasa a todos. Por eso no hay UNA hora de arranque
    # sino seis, de 09:47 a 14:47 local: alcanza con que GitHub largue cualquiera
    # de ellas dentro de la rueda. El minuto 47 y no el 0 porque el tope de hora
    # es la franja más disputada del scheduler.
    #
    # El concurrency group hace el resto: corre una sola, las demás se cancelan.
    # Y como todas cierran 17:15, la que gane cubre hasta el final de la rueda
    # en vez de morirse por haber nacido pasada su propia hora de corte, que es
    # lo que le venía pasando a los jobs de la mañana desde el 2 de septiembre.
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "47 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: valuar-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    # Red de seguridad por si --hasta fallara, apenas por debajo del tope duro de
    # 6 horas de GitHub. Si el job llegara a arrancar puntual a las 09:47 no
    # alcanzaría las 17:15 ni con el tope entero: ahí lo cubre la corrida que el
    # concurrency group deja en espera, que arranca cuando ésta termina.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revaluar en continuo hasta las 17:15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:  ${{ secrets.SERVICE_KEY }}
          LOCAL_TZ:     ${{ secrets.LOCAL_TZ }}
          MAE_API_KEY:  ${{ secrets.MAE_API_KEY }}
        # --intervalo 5: el ciclo tarda 0,8s, así que hay margen de sobra.
        # --refresco 30: recarga instrumentos, series y REM, para no perderse el
        #   CER del día si el BCRA lo publica con el mercado abierto.
        run: python valuar_loop.py --intervalo 5 --refresco 30 --hasta 17:15
