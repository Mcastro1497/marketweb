# precios2.py durante la rueda, tarde.
#
# El proceso suscribe al websocket de ECO una sola vez y después sólo espera:
# el handler recibe los ticks y los empuja a `prices`. Con --hasta se apaga solo,
# así que no queda como daemon.
#
# Va partido en dos jobs porque GitHub corta cualquier job a las 6 horas y la
# rueda dura casi 7. Arranca 13:25 y no 13:30 a propósito: los cron de GitHub se demoran, y solapar 5 minutos
# con el de la mañana evita perder ticks en el empalme.
name: Precios tarde

on:
  schedule:
    # Los cron de GitHub son en UTC y NO ajustan por horario de verano.
    # 16:00 UTC = 13:00 en Argentina (UTC-3, sin DST).
    #
    # Mismo criterio que el de la mañana: se adelanta para absorber la demora del
    # cron de GitHub. El de la mañana termina 13:30, así que arrancar a las 13:00
    # da media hora de colchón para el empalme en vez de cinco minutos.
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

concurrency:
  group: precios-tarde
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    # Red de seguridad por si --hasta fallara. Mayor que la ventana real
    # (13:00 -> 17:15 son 255 minutos), y por debajo del tope de 6 horas de GitHub.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recibir precios hasta las 17:15
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:       ${{ secrets.SERVICE_KEY }}
          ECO_USER:          ${{ secrets.ECO_USER }}
          ECO_PASS:          ${{ secrets.ECO_PASS }}
          ECO_ACCT:          ${{ secrets.ECO_ACCT }}
          ECO_BASE:          ${{ secrets.ECO_BASE }}
          ECO_WS:            ${{ secrets.ECO_WS }}
          DEFAULT_SEGMENT:   ${{ secrets.DEFAULT_SEGMENT }}
          PUSH_INTERVAL_SEC: ${{ secrets.PUSH_INTERVAL_SEC }}
          LOCAL_TZ:          ${{ secrets.LOCAL_TZ }}
        run: python precios2.py --hasta 17:15
