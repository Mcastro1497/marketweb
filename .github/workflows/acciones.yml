# Acciones y CEDEARs durante toda la rueda, en un solo job.
#
# Mismo patrón que los workflows de precios2: el proceso suscribe al websocket de
# ECO una sola vez y después sólo espera los ticks. Con --hasta se apaga solo.
#
# POR QUÉ EXISTE
# acciones.py era un daemon que había que levantar a mano, y en los hechos no se
# levantaba: el 08-09-2026 la tabla `acciones_cedears` tenía veinte días sin
# actualizarse y nada lo había avisado. Los precios de las 69 acciones y los 400
# CEDEARs del dashboard salen de acá.
#
name: Acciones y CEDEARs

on:
  schedule:
    # GitHub larga los cron programados de este repo entre 2 y 5 horas tarde, de
    # forma consistente y variable (medido sobre precios, valuar_loop y pipeline).
    # No es la expresión: le pasa a todos. Por eso no hay UNA hora de arranque
    # sino seis, de 09:47 a 14:47 local: alcanza con que GitHub largue cualquiera
    # de ellas dentro de la rueda. El minuto 47 y no el 0 porque el tope de hora
    # es la franja más disputada del scheduler.
    #
    # El concurrency group hace el resto: corre una sola, las demás se cancelan.
    # Y como todas cierran 17:15, la que gane cubre hasta el final de la rueda
    # en vez de morirse por haber nacido pasada su propia hora de corte, que es
    # lo que le venía pasando a los jobs de la mañana desde el 2 de septiembre.
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "47 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: acciones
  cancel-in-progress: false

jobs:
  acciones:
    runs-on: ubuntu-latest
    # Red de seguridad por si --hasta fallara. Mayor que la ventana real y por
    # debajo del tope de 6 horas de GitHub.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recibir precios hasta las 17:15
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY:       ${{ secrets.SERVICE_KEY }}
          ECO_USER:          ${{ secrets.ECO_USER }}
          ECO_PASS:          ${{ secrets.ECO_PASS }}
          ECO_ACCT:          ${{ secrets.ECO_ACCT }}
          ECO_BASE:          ${{ secrets.ECO_BASE }}
          ECO_WS:            ${{ secrets.ECO_WS }}
          PUSH_INTERVAL_SEC: ${{ secrets.PUSH_INTERVAL_SEC }}
          LOCAL_TZ:          ${{ secrets.LOCAL_TZ }}
        run: python acciones.py --hasta 17:15
